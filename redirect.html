<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Parameter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        #code {
            margin-top: 24px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            word-break: break-word;
            font-family: monospace;
        }

        .copy-btn {
            margin-top: 16px;
            padding: 10px 20px;
            font-size: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .copy-btn:hover {
            background-color: #333333;
        }

        .copy-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .copy-btn.copied {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
<h1>TikTok Authorization Token</h1>
<div id="code"></div>
<button id="copyBtn" class="copy-btn" onclick="copyToken()">Copy to clipboard</button>

<script>
    const params = new URLSearchParams(window.location.search);
    const value = params.get("code");
    const codeElement = document.getElementById("code");
    const copyBtn = document.getElementById("copyBtn");

    if (value !== null) {
        codeElement.textContent = value;
    } else {
        codeElement.textContent = "No code parameter provided";
        copyBtn.disabled = true;
    }

    async function copyToken() {
        if (!value) return;

        try {
            await navigator.clipboard.writeText(value);

            // Temporary feedback state
            copyBtn.textContent = "Copied to clipboard!";
            copyBtn.classList.add("copied");

            setTimeout(() => {
                copyBtn.textContent = "Copy to clipboard";
                copyBtn.classList.remove("copied");
            }, 2000);
        } catch (err) {
            console.error("Failed to copy text: ", err);
        }
    }
</script>
</body>
</html>
